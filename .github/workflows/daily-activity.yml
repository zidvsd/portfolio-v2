
name: Daily Activity

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          mkdir -p activity
          echo "$(date -u +%Y-%m-%d) - Automated maintenance check" >> activity/log.md

      - name: Commit changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add activity/log.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: daily maintenance log"
            git push
          fi
